- type: entity
  parent: [ClothingModsuitStandard]
  id: BloodredModsuitBackpackhull
  name: CDT "Raider" Modsuit Control
  description: A control module for the "Raider" modsuit.
  components:
  - type: Sprite
    sprite: _TG/Clothing/Modsuit/bloodredmodsuit.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.01
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingModsuitHelmetBloodredModsuithull
      gloves: ClothingModsuitGauntletsBloodredModsuithull
      outerClothing: ClothingModsuitChestplateBloodredModsuithull
      shoes: ClothingModsuitBootsBloodredModsuithull
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHyper
        whitelist:
          components:
          - PowerCell
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,7,4
  - type: SealableClothingVisuals
    visualLayers:
      back:
      - state: equipped-BACKPACK-sealed
      - state: equipped-BACKPACK-sealed_glow
        shader: unshaded

- type: entity
  parent: [ClothingModsuitGauntletsStandard]
  id: ClothingModsuitGauntletsBloodredModsuithull
